<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Fotograficzne</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <a href="#" onclick="pokaSekcje('o-mnie')">Ja</a>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="#" onclick="pokaSekcje('o-mnie')">O mnie</a></li>
                <li><a href="#" onclick="pokaSekcje('natura')">Natura</a></li>
                <li><a href="#" onclick="pokaSekcje('wydarzenia')">Wydarzenia</a></li>
                <li><a href="#" onclick="pokaSekcje('motoryzacja')">Motoryzacja</a></li>
                <li><a href="#" onclick="pokaSekcje('miasto')">Miasto</a></li>
                <li><a href="#" onclick="pokaSekcje('kontakt')">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-image"></div>

    <main class="content">
        <section id="o-mnie" class="sekcja-strony">
            <h2>O mnie</h2>
        </section>

        <section id="natura" class="sekcja-strony">
            <h2>Natura</h2>
            <div class="gallery">
                <div class="gallery-item"><img src="1000008447.jpg" alt="Roślina"></div>
                <div class="gallery-item"><img src="1000009033.JPG" alt="Kwiat"></div>
                <div class="gallery-item"><img src="1000010143.JPG" alt="Wodospad"></div>
            </div>
        </section>

        <section id="wydarzenia" class="sekcja-strony">
            <h2>Wydarzenia</h2>
            <div class="gallery">
                <div class="gallery-item"><img src="1000006875.JPG" alt="Tort urodzinowy"></div>
                <div class="gallery-item"><img src="DSC_7924.jpg" alt="Kieliszek"></div>
            </div>
        </section>

        <section id="motoryzacja" class="sekcja-strony">
            <h2>Motoryzacja</h2>
            <div class="gallery">
                <div class="gallery-item"><img src="1000002844.PNG" alt="Samochód przód"></div>
                <div class="gallery-item"><img src="1000006882.png" alt="Samochód bok"></div>
                <div class="gallery-item"><img src="1000007184.JPG" alt="Wnętrze samochodu"></div>
                <div class="gallery-item"><img src="1000007186.JPG" alt="Samochód w warsztacie"></div>
            </div>
        </section>

        <section id="miasto" class="sekcja-strony">
            <h2>Miasto</h2>
            <div class="gallery">
                <div class="gallery-item"><img src="1000008854.JPG" alt="Kawiarnia nocą"></div>
                <div class="gallery-item"><img src="DSC_5847.jpg" alt="Wiatrak"></div>
            </div>
        </section>

        <section id="kontakt" class="sekcja-strony">
            <h2>Kontakt</h2>
        </section>
    </main>

    <script>
        function pokaSekcje(id) {
            let sekcje = document.querySelectorAll('.sekcja-strony');
            sekcje.forEach(function(sekcja) {
                sekcja.style.display = 'none';
            });
            document.getElementById(id).style.display = 'block';
        }
        
        pokaSekcje('o-mnie');
    </script>
</body>
</html>
